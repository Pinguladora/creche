[package]
name = "creche-sink"
description = "Host-side receiver for creche-observer: decodes every sandbox's record stream into JSON lines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Criterion drives the benchmarks: keep libtest out of `cargo bench`.
[lib]
bench = false

[[bin]]
name = "creche-sink"
bench = false

[dependencies]
creche-wire.workspace = true
anyhow.workspace = true
base64ct.workspace = true
bytes.workspace = true
h2.workspace = true
http.workspace = true
lexopt.workspace = true
p256.workspace = true
prost.workspace = true
ruzstd.workspace = true
miniserde.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["fs", "io-std", "io-util", "net", "rt", "sync", "time"] }
x509-cert.workspace = true
zeroize.workspace = true

[dev-dependencies]
creche-wire = { workspace = true, features = ["sample"] }
criterion.workspace = true
proptest.workspace = true
serde_json.workspace = true
tempfile.workspace = true
# A paused clock for timing tests.
tokio = { workspace = true, features = ["test-util"] }
zerocopy.workspace = true

[[bench]]
name = "render"
harness = false

[lints]
workspace = true
