threagile_version: 1.0.0

# creche: an eBPF observer inside Kata Containers microVMs that streams what AI agent tools do to a sink on the host.
# Written from the README, SECURITY.md and the ADRs in docs/adr (up to 0017).

title: creche

date: 2026-11-14

author:
  name: creche maintainers
  homepage: https://github.com/Pinguladora/creche

business_criticality: important

business_overview:
  description: Visibility into what runs inside Kata Containers microVMs. Process trees, outgoing connections and file writes of the tools an AI agent spawns are streamed to the host, attributed to the sandbox and its pod, and kept as a tamper-evident audit trail.
  images: []

technical_overview:
  description: An observer in the guest loads BPF programs (aya) and forwards their ring buffer records over hybrid vsock. The sink on the host attests which sandbox a connection comes from, names its pod from containerd's bundles, writes JSON lines with hash chained and SVID signed checkpoints, and exports them over OTLP. A verifier checks saved output against the trust bundle and the pod history. Releases are built, signed and published by GitHub Actions.
  images: []

questions: {}

abuse_cases:
  Forged Events: A process in the guest sends records the host takes for the observer's.
  Misattribution: A guest or a host process makes events appear under another sandbox, pod or container.
  Blinding: The guest floods or stalls the sink so that events of other sandboxes are lost.
  Audit Rewrite: Whoever takes over a sink or the archive rewrites the audit trail without detection.
  Release Tampering: A modified observer or sink binary reaches the guest image or the nodes.

security_requirements:
  Guest Untrusted: Nothing the guest sends may crash, stall or mislead the sink.
  Host Attests Identity: The sandbox, pod and node of a stream come from the host, never from the guest.
  Tamper Evident Trail: Missing or changed lines must be detectable by a verifier.
  Verifiable Releases: Every release carries signed checksums and SLSA provenance.

