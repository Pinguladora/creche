individual_risk_categories: {}

# Statuses reflect the controls in this repository. Risks of the integrator's own deployment are accepted here and
# left to it. Risks still open for a decision are not listed and show as unchecked.
risk_tracking:

  # The guest and the sink

  untrusted-deserialization@creche-sink:
    status: mitigated
    justification: The guest is untrusted by design (SECURITY.md). creche-wire decodes records with bounds checks and no copies (ADR 0004), and the fuzz targets decode and sink_stream exercise the decoder and the sink's stream handling.
    date: 2026-11-14

  untrusted-deserialization@creche-observer:
    status: mitigated
    justification: The observer forwards records without decoding them (ADR 0004). Agent labels read from cgroup extended attributes are checked against the key and value rules and capped at 8 before they are sent (ADR 0017).
    date: 2026-11-14

  path-traversal@creche-sink@containerd-bundles@creche-sink>read-bundle:
    status: mitigated
    justification: Sandbox ids must be containerd identifiers (valid_id in listen.rs), and the bundle must be owned by root and private to it, or the pod is reported as unknown (ADR 0010).
    date: 2026-11-14

  path-traversal@creche-sink@audit-archive@creche-sink>write-archive:
    status: false-positive
    justification: The sink writes to stdout only. The operator's redirect names the file, and no path comes from the guest.
    date: 2026-11-14

  missing-vault@creche-sink:
    status: mitigated
    justification: The SVID comes from the SPIFFE Workload API, and each stream's signing key lives in memory only and is erased once the next key is derived (ADR 0014).
    date: 2026-11-14

  kubernetes-api-write-access@creche-observer@creche-observer>vsock-stream:
    status: false-positive
    justification: The VMM is tagged container-platform because the technology list has no hypervisor. The observer does not reach the Kubernetes API.
    date: 2026-11-14

  wrong-communication-link-content@creche-observer@creche-observer>ring-buffer:
    status: false-positive
    justification: The observer writes its own pid and port into the programs before they load, configuration rather than a data asset.
    date: 2026-11-14

  # Audit trail at rest and its checks

  missing-hardening@audit-archive:
    status: accepted
    justification: The archive is the integrator's file on the node. The hash chain proves integrity only as far as its checkpoints are shipped to a second store (README, ADR 0012).
    date: 2026-11-14

  unencrypted-asset@audit-archive:
    status: accepted
    justification: Encryption at rest of the node's disk is the integrator's. The central store is encrypted.
    date: 2026-11-14

  missing-file-validation@creche-verifier:
    status: false-positive
    justification: The verifier is a command line tool that reads the files the auditor names, not an upload.
    date: 2026-11-14

  server-side-request-forgery@creche-verifier@log-store@creche-verifier>read-trail:
    status: false-positive
    justification: The verifier makes no requests. It reads files the auditor exported.
    date: 2026-11-14

  server-side-request-forgery@creche-verifier@kube-api@creche-verifier>pod-history:
    status: false-positive
    justification: The verifier makes no requests. It reads the pod history file the auditor exported.
    date: 2026-11-14

  missing-identity-store@creche-verifier:
    status: accepted
    justification: Identities come from SPIRE and the cluster, both outside creche.
    date: 2026-11-14

  missing-cloud-hardening@cluster-network:
    status: accepted
    justification: The cluster is the integrator's.
    date: 2026-11-14

  missing-cloud-hardening@security-backend:
    status: accepted
    justification: The security backend is the integrator's.
    date: 2026-11-14

  # Build and release

  missing-authentication@image-builder>download-release@image-builder@github-releases:
    status: mitigated
    justification: Releases are public. Integrity comes from sha256sum, cosign verify-blob pinned to the release workflow's identity and slsa-verifier (README, Releases).
    date: 2026-11-14

  unguarded-access-from-internet@github-releases@github-actions@github-actions>publish-release:
    status: accepted
    justification: Releases are public by design. Publishing needs the workflow's token.
    date: 2026-11-14

  unguarded-access-from-internet@github-releases@image-builder@image-builder>download-release:
    status: accepted
    justification: Releases are public by design and verified by signature and provenance.
    date: 2026-11-14

  unguarded-access-from-internet@github-repo@*@*:
    status: accepted
    justification: The repository is public. Pushes need an authenticated GitHub identity.
    date: 2026-11-14

  code-backdooring@github-releases:
    status: mitigated
    justification: checksums.txt is signed keyless with cosign, every tarball has SLSA provenance, and the release workflow's last job downloads and verifies the release.
    date: 2026-11-14

  code-backdooring@github-actions:
    status: mitigated
    justification: Actions are pinned by digest, harden-runner blocks egress outside an allowlist in every workflow, and zizmor checks the workflows.
    date: 2026-11-14

  missing-hardening@github-actions:
    status: mitigated
    justification: Workflows default to no permissions, harden-runner blocks egress, actions are pinned by digest and zizmor checks the workflows.
    date: 2026-11-14

  missing-cloud-hardening@github:
    status: accepted
    justification: GitHub's hosting is not ours to harden. What we control is covered by the build and release entries above, and Scorecard runs on the repository.
    date: 2026-11-14

  missing-file-validation@github-actions:
    status: false-positive
    justification: The workflows take no uploads, only the repository's own checkout.
    date: 2026-11-14

  server-side-request-forgery@github-actions@*@*:
    status: mitigated
    justification: The workflows call fixed endpoints, and harden-runner blocks egress outside an allowlist.
    date: 2026-11-14

  unchecked-deployment@github-actions:
    status: mitigated
    justification: CI runs fmt, clippy, cargo-deny, the fuzz build and the tests, and Trivy, zizmor and Scorecard run in their own workflows.
    date: 2026-11-14

  unchecked-deployment@github-repo:
    status: mitigated
    justification: Every change is checked by CI, see unchecked-deployment@github-actions.
    date: 2026-11-14

  unchecked-deployment@github-releases:
    status: mitigated
    justification: Releases are built only by the checked release workflow, see unchecked-deployment@github-actions.
    date: 2026-11-14

  unchecked-deployment@image-builder:
    status: accepted
    justification: The image builds are the integrator's.
    date: 2026-11-14

  unchecked-deployment@maintainer-workstation:
    status: mitigated
    justification: hk runs the linters, cargo-deny and the kingfisher secret scan before each commit.
    date: 2026-11-14

  accidental-secret-leak@github-repo:
    status: mitigated
    justification: hk runs the kingfisher secret scan before each commit.
    date: 2026-11-14

  accidental-secret-leak@github-releases:
    status: mitigated
    justification: Releases hold only the reproducible builds, checksums and provenance.
    date: 2026-11-14

  unencrypted-asset@github-repo:
    status: false-positive
    justification: The source is public.
    date: 2026-11-14

  unencrypted-asset@github-releases:
    status: false-positive
    justification: The releases are public.
    date: 2026-11-14

  # Coding agents

  unguarded-access-from-internet@mise-mcp@coding-agent@coding-agent>mise-mcp:
    status: false-positive
    justification: The mise MCP server talks over stdio to the agent that started it and listens on no port.
    date: 2026-11-14

  wrong-communication-link-content@coding-agent@coding-agent>mise-mcp:
    status: false-positive
    justification: The agent runs mise tasks through the server, actions rather than a data asset.
    date: 2026-11-14
