custom_risk_categories: []

# Risks of the integrator's own deployment are accepted here and left to it.
risk_tracking:

  # The guest and the sink

  untrusted-deserialization@creche-sink:
    status: mitigated
    justification: Records are decoded with bounds checks (ADR 0004) and fuzzed.
    date: 2026-11-14

  untrusted-deserialization@creche-observer:
    status: mitigated
    justification: The observer forwards records without decoding them (ADR 0004) and checks agent labels before sending them (ADR 0017).
    date: 2026-11-14

  path-traversal@creche-sink@containerd-bundles@creche-sink>read-bundle:
    status: mitigated
    justification: Sandbox ids must be containerd identifiers, and bundles must be private to root (ADR 0010).
    date: 2026-11-14

  path-traversal@creche-sink@audit-archive@creche-sink>write-archive:
    status: false-positive
    justification: The sink writes to stdout only.
    date: 2026-11-14

  wrong-communication-link-content@creche-observer@creche-observer>ring-buffer:
    status: false-positive
    justification: Configuration written into the programs before they load, not a data asset.
    date: 2026-11-14

  # Audit trail at rest and its checks

  missing-hardening@audit-archive:
    status: accepted
    justification: The archive is the integrator's (ADR 0012).
    date: 2026-11-14

  unencrypted-asset@audit-archive:
    status: accepted
    justification: Encryption at rest is the integrator's.
    date: 2026-11-14

  missing-file-validation@creche-verifier:
    status: false-positive
    justification: The verifier reads files named on its command line, not uploads.
    date: 2026-11-14

  missing-identity-store@log-store:
    status: accepted
    justification: Identities come from SPIRE and the cluster.
    date: 2026-11-14

  path-traversal@creche-verifier@audit-evidence@creche-verifier>read-evidence:
    status: false-positive
    justification: The verifier opens only the files named on its command line.
    date: 2026-11-14

  missing-hardening@audit-evidence:
    status: accepted
    justification: The exports are the auditor's.
    date: 2026-11-14

  unencrypted-asset@audit-evidence:
    status: accepted
    justification: Encryption at rest is the auditor's.
    date: 2026-11-14

  missing-cloud-hardening@cluster-network:
    status: accepted
    justification: The cluster is the integrator's.
    date: 2026-11-14

  missing-cloud-hardening@security-backend:
    status: accepted
    justification: The security backend is the integrator's.
    date: 2026-11-14

  # Left to the integrator, or outside this model

  missing-build-infrastructure@creche-sink:
    status: accepted
    justification: Building and releasing are outside this model.
    date: 2026-11-15

  tenant-resource-exhaustion@creche-sink@kata-vmm>hybrid-vsock:
    status: in-progress
    justification: Each sandbox gets bounded connections, queues and caches.
    date: 2026-11-15

  virtual-machine-escape@kata-vmm@creche-sink:
    status: accepted
    justification: Isolation is Kata's and the hypervisor's (ADR 0018).
    date: 2026-11-15

  virtual-machine-escape@kata-vmm@audit-archive:
    status: accepted
    justification: Isolation is Kata's and the hypervisor's (ADR 0012).
    date: 2026-11-15
