# Risks that the built-in rules cannot find, from reviews of the code. They stay unchecked until they are fixed.
custom_risk_categories:
  - id: vmm-impersonation
    title: VMM Impersonation
    description: The sink admits a connection on a sandbox's clh.sock_P only from the process it takes for the sandbox's VMM. It finds that process by a listening socket whose bound path, as the peer's /proc/<pid>/net/unix lists it, resolves to the sandbox's clh.sock. That path is only the name the socket was bound under. Its binder can replace it with a symlink to any sandbox's clh.sock, or a hardlink when it owns that file, or bind under the same path in a mount namespace of its own.
    impact: Any process running as the VMM's user, the VMM of another sandbox included, can inject events under any sandbox's id and pod on the node. That defeats the attestation of the sandbox (ADR 0009), so the audit trail of every sandbox on the node can be forged.
    asvs: "V8: Authorization"
    cheat_sheet: https://cheatsheetseries.owasp.org/cheatsheets/Authentication_Cheat_Sheet.html
    action: Kernel-Attested Peer Identity
    mitigation: Take the VMM's identity from the kernel instead of a path. A connection to clh.sock carries the credentials of the process listening on it. Pin that process by its pid and start time, and admit only it.
    check: Is the VMM identified without reading a bound path back from /proc?
    function: development
    stride: spoofing
    detection_logic: A review of the sink's peer admission (peer::check), reproduced with a same-user process that bound a socket and replaced its name with a symlink to another sandbox's clh.sock.
    risk_assessment: Likely once an attacker runs as the VMM's user, for example after a virtual machine escape, and the impact is high, as it forges the attributed events of every sandbox on the node.
    false_positives: None while the admission resolves bound paths.
    model_failure_possible_reason: false
    cwe: 290
    risks_identified:
      <b>VMM Impersonation</b> at <b>creche Sink</b> via <b>Hybrid Vsock</b>:
        severity: high
        exploitation_likelihood: likely
        exploitation_impact: high
        data_breach_probability: improbable
        data_breach_technical_assets: []
        most_relevant_technical_asset: creche-sink
        most_relevant_communication_link: kata-vmm>hybrid-vsock

  - id: sink-memory-exposure
    title: Sink Memory Exposure
    description: The sink runs as root or as the VMM's user, and sets neither PR_SET_DUMPABLE nor a seccomp filter. When it shares the VMM's user, a process of that user, such as code that escaped a guest, may attach to it with ptrace or read its /proc/<pid>/mem, as far as the host's ptrace restrictions allow, and take the signing keys of the open streams.
    impact: An attacker with the keys of the open streams can sign forged checkpoints for the node.
    asvs: "V13: Configuration"
    cheat_sheet: https://man7.org/linux/man-pages/man2/PR_SET_DUMPABLE.2const.html
    action: Process Hardening
    mitigation: Run the sink as another user than the VMM's, and have it mark itself not dumpable (PR_SET_DUMPABLE 0) when it starts, which keeps processes of the same user from attaching to it or reading its memory whatever the host's ptrace settings.
    check: Does the sink run as another user than the VMM, or mark itself not dumpable?
    function: development
    stride: information-disclosure
    detection_logic: A review of how the sink runs, while triaging the virtual machine escape of its host.
    risk_assessment: Unlikely, as it needs a foothold as the VMM's user and a host that lets the same user ptrace. The impact is high, as the keys sign the audit trail.
    false_positives: Sinks that run as root or as their own user, apart from the VMM's.
    model_failure_possible_reason: false
    cwe: 668
    risks_identified:
      <b>Sink Memory Exposure</b> at <b>creche Sink</b>:
        severity: medium
        exploitation_likelihood: unlikely
        exploitation_impact: high
        data_breach_probability: possible
        data_breach_technical_assets: [creche-sink]
        most_relevant_technical_asset: creche-sink

# Statuses reflect the controls in this repository. Risks of the integrator's own deployment are accepted here and
# left to it. Risks still open for a decision are not listed and show as unchecked.
risk_tracking:

  # The guest and the sink

  vmm-impersonation@creche-sink@kata-vmm>hybrid-vsock:
    status: mitigated
    justification: The sink asks the kernel which process listens on the sandbox's vsock socket, by connecting to it, and admits only that process, pinned by its pid and start time. No bound path is read back (ADR 0018).
    date: 2026-11-15

  sink-memory-exposure@creche-sink:
    status: mitigated
    justification: The listening sink marks itself not dumpable when it starts, so processes of its user, the VMM's included, can neither trace it nor read its memory.
    date: 2026-11-15

  untrusted-deserialization@creche-sink:
    status: mitigated
    justification: The guest is untrusted by design (SECURITY.md). creche-wire decodes records with bounds checks and no copies (ADR 0004), and the fuzz targets decode and sink_stream exercise the decoder and the sink's stream handling.
    date: 2026-11-14

  untrusted-deserialization@creche-observer:
    status: mitigated
    justification: The observer forwards records without decoding them (ADR 0004). Agent labels read from cgroup extended attributes are checked against the key and value rules and capped at 8 before they are sent (ADR 0017).
    date: 2026-11-14

  path-traversal@creche-sink@containerd-bundles@creche-sink>read-bundle:
    status: mitigated
    justification: Sandbox ids must be containerd identifiers (valid_id in listen.rs), and the bundle must be owned by root and private to it, or the pod is reported as unknown (ADR 0010).
    date: 2026-11-14

  path-traversal@creche-sink@audit-archive@creche-sink>write-archive:
    status: false-positive
    justification: The sink writes to stdout only. The operator's redirect names the file, and no path comes from the guest.
    date: 2026-11-14

  wrong-communication-link-content@creche-observer@creche-observer>ring-buffer:
    status: false-positive
    justification: The observer writes its own pid and port into the programs before they load, configuration rather than a data asset.
    date: 2026-11-14

  # Audit trail at rest and its checks

  missing-hardening@audit-archive:
    status: accepted
    justification: The archive is the integrator's file on the node. The hash chain proves integrity only as far as its checkpoints are shipped to a second store (README, ADR 0012).
    date: 2026-11-14

  unencrypted-asset@audit-archive:
    status: accepted
    justification: Encryption at rest of the node's disk is the integrator's. The central store is encrypted.
    date: 2026-11-14

  missing-file-validation@creche-verifier:
    status: false-positive
    justification: The verifier is a command line tool that reads the files the auditor names, not an upload.
    date: 2026-11-14

  missing-identity-store@log-store:
    status: accepted
    justification: Identities come from SPIRE, the cluster and the central store, all outside creche.
    date: 2026-11-14

  path-traversal@creche-verifier@audit-evidence@creche-verifier>read-evidence:
    status: false-positive
    justification: The verifier opens only the files named on its command line. No path comes from the data it reads.
    date: 2026-11-14

  missing-hardening@audit-evidence:
    status: accepted
    justification: The exports are the auditor's files. The verifier checks the stream lines against their hash chain and signatures, but it trusts the bundle and the pod history it is given, so the auditor must take them from trusted sources and keep them unchanged.
    date: 2026-11-14

  unencrypted-asset@audit-evidence:
    status: accepted
    justification: Encryption at rest of the auditor's machine is the auditor's.
    date: 2026-11-14

  missing-cloud-hardening@cluster-network:
    status: accepted
    justification: The cluster is the integrator's.
    date: 2026-11-14

  missing-cloud-hardening@security-backend:
    status: accepted
    justification: The security backend is the integrator's.
    date: 2026-11-14

  # Left to the integrator, or outside this model

  missing-build-infrastructure@creche-sink:
    status: accepted
    justification: Building and releasing are outside this model. Releases carry signed checksums and SLSA provenance (README).
    date: 2026-11-15

  tenant-resource-exhaustion@creche-sink@kata-vmm>hybrid-vsock:
    status: in-progress
    justification: Each sandbox gets at most 4 connections and an eighth of the writer and exporter queues, its records are decoded off the runtime thread, and its cgroup and task caches are bounded. What one sandbox's decoding costs in CPU is not bounded per sandbox yet.
    date: 2026-11-15

  virtual-machine-escape@kata-vmm@creche-sink:
    status: accepted
    justification: Keeping guests in their VMs is Kata's and the hypervisor's. The sink takes each sandbox's VMM from the kernel, marks itself not dumpable and erases keys behind its checkpoints, so an escaped process running as the VMM's user can neither pass as another sandbox nor read or reuse earlier keys. Running the sink as its own user is the deployment's.
    date: 2026-11-15

  virtual-machine-escape@kata-vmm@audit-archive:
    status: accepted
    justification: An escaped process running as the sink's user could rewrite the archive. The hash chain shows it only where checkpoints are shipped to a second store, and running the sink as its own user is the deployment's (README, ADR 0012).
    date: 2026-11-15
