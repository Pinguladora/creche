    confidentiality: confidential
    integrity: critical
    availability: important
    justification_cia_rating: Command arguments and paths can hold secrets, and the events are the evidence of what an agent did

  Agent Labels:
    id: agent-labels
    description: user.creche.agent extended attributes the agents set on their delegated cgroups
    usage: business
