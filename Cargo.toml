[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/Pinguladora/creche"
publish = false

[workspace.dependencies]
creche-wire = { path = "crates/creche-wire" }
anyhow = "1.0.104"
aya = { version = "0.16.0", default-features = false }
aya-obj = "0.6.0"
lexopt = "0.3.2"
sha2 = { version = "0.11.1", default-features = false }
miniserde = { version = "0.1.46", default-features = false, features = ["std"] }
nix = { version = "0.31.3", default-features = false }
criterion = { version = "0.8.2", default-features = false }
proptest = { version = "1.12.0", default-features = false, features = ["std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", default-features = false }
zerocopy = { version = "0.8", features = ["derive"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
dbg_macro = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unwrap_used = "deny"

# Fast local builds: line tables keep panic backtraces readable without full
# debug info, and build scripts and proc-macros are optimized because they run
# on every build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.build-override]
opt-level = 3

# Shipped binaries: whole-program optimization, no unwinding tables, and
# overflow checks kept on (the cost is negligible next to syscalls).
[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true

# Release code with symbols and line tables, for perf in the guest.
[profile.profiling]
inherits = "release"
strip = false
debug = "line-tables-only"

[profile.release-assertions]
inherits = "release"
debug-assertions = true
