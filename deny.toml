# cargo-deny: https://embarkstudios.github.io/cargo-deny/
[graph]
targets = ["x86_64-unknown-linux-gnu", "x86_64-unknown-linux-musl"]

[advisories]
# Vulnerabilities and yanked crates fail. Unmaintained crates are reported.
yanked = "deny"

[licenses]
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "BSD-2-Clause",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
# subtle (constant-time primitives) sits under every RustCrypto elliptic curve,
# p256 included, and is BSD-3-Clause. Allowed for that crate only.
exceptions = [
    { crate = "subtle", allow = ["BSD-3-Clause"] },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace members depend on each other by path. None is published.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
