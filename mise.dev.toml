# Local development tooling, layered on top of mise.toml when the `dev` env is
# active. .miserc.toml sets `env = ["dev"]`, so this loads by default for local
# work but never in CI (CI sets MISE_ENV=ci). Everything here is lint, format,
# hook or mutation testing tooling that builds and tests never need.

[env]
HK_MISE = 1

[hooks]
# Install or update the git hooks when tools are installed. Lives here, not in
# mise.toml, so it does not run in CI, where hk is not installed.
postinstall = "hk install --mise"

[tools]
# hk and the pkl CLI it evaluates hk.pkl with. Keep hk in step with hk.pkl's import.
"aqua:jdx/hk" = "2.11.1"
"aqua:apple/pkl" = "0.33.0"
yamlfmt = "0.21.0"                 # YAML formatter (hk pairs it with yamllint)
yamllint = "1.38.0"
kingfisher = "2.17.0"              # secret scanner (hk)
"github:sourcefrog/cargo-mutants" = "27.1.0"   # mutation testing (mise run mutants)
pinact = "5.0.2"                   # pin GitHub Actions to a SHA (hk pre-push)
"github:rust-fuzz/cargo-fuzz" = "0.13.2"

[tasks.fuzz]
description = "Fuzz every target for FUZZ_SECONDS (default 60) each, starting from seed inputs"
# No sanitizer: the crates forbid unsafe, and stable Rust can build it. A crash
# lands in fuzz/artifacts/<target>/ and `cargo fuzz run <target> <file>` replays it.
run = """
cargo run -q --manifest-path fuzz/Cargo.toml --example seeds
for target in $(cargo fuzz list); do
  cargo fuzz run -s none -O --target x86_64-unknown-linux-gnu "$target" -- \
    -max_total_time="${FUZZ_SECONDS:-60}" -max_len=8192 || exit
done
"""
