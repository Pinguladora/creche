name: Release

# Builds, signs and publishes a release for every v* tag, which auto-release.yml
# or a maintainer pushes. The two binaries, creche-observer for the guest and
# creche-sink for the host, are static musl builds, packed into reproducible
# tarballs. checksums.txt covers them and is signed keyless with cosign, and the
# SLSA generator attests their provenance. A last job downloads the release and
# checks all three, as a user would.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read # checkout
      id-token: write # octo-sts OIDC exchange + cosign keyless signing
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    env:
      MISE_ENV: ci
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: "true"
          disable-sudo: "true"
          allowed-endpoints: >
            github.com:443 api.github.com:443 uploads.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 raw.githubusercontent.com:443 mise.jdx.dev:443 static.rust-lang.org:443 index.crates.io:443 static.crates.io:443 crates.io:443 fulcio.sigstore.dev:443 rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443 timestamp.sigstore.dev:443 token.actions.githubusercontent.com:443 octo-sts.dev:443
      - name: Optimize Git config for CI
        run: |
          git config --global core.compression 0
          git config --global core.fsync -all
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          filter: "blob:none"
      - name: Obtain release token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguladora/creche
          identity: release
      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install: true
          cache: false
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Build, sign and publish
        run: mise run release
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Generate subject hashes for SLSA provenance
        id: hash
        run: |
          echo "hashes=$(base64 -w0 dist/checksums.txt)" >> "$GITHUB_OUTPUT"

  provenance:
    name: SLSA provenance
    needs: release
    permissions:
      actions: read # Required by the SLSA generator
      id-token: write # SLSA provenance signing
      contents: write # Attestation upload
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.release.outputs.hashes }}"
      # Attach the provenance to the release, so users can verify downloads.
      upload-assets: true
      provenance-name: provenance.intoto.jsonl
      private-repository: false

  verify:
    name: Verify release
    needs: [release, provenance]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read # checkout
      id-token: write # octo-sts OIDC exchange
      actions: read # Download the provenance artifact
    env:
      MISE_ENV: ci
      # Run tasks with the tools installed below, not the whole Rust toolchain.
      MISE_TASK_RUN_AUTO_INSTALL: "false"
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: block
          disable-telemetry: "true"
          disable-sudo: "true"
          allowed-endpoints: >
            github.com:443 api.github.com:443 codeload.github.com:443 objects.githubusercontent.com:443 release-assets.githubusercontent.com:443 raw.githubusercontent.com:443 mise.jdx.dev:443 fulcio.sigstore.dev:443 rekor.sigstore.dev:443 tuf-repo-cdn.sigstore.dev:443 token.actions.githubusercontent.com:443 octo-sts.dev:443 *.actions.githubusercontent.com:443 *.blob.core.windows.net:443
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Obtain verify token
        id: octo-sts
        uses: octo-sts/action@f603d3be9d8dd9871a265776e625a27b00effe05 # v1.1.1
        with:
          scope: Pinguladora/creche
          identity: verify
      - name: Set up mise
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          # Verifying needs only slsa-verifier, not the Rust toolchain.
          install_args: aqua:slsa-framework/slsa-verifier
          cache: false
        env:
          GITHUB_TOKEN: ${{ steps.octo-sts.outputs.token }}
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Download release artifacts for verification
        env:
          GH_TOKEN: ${{ steps.octo-sts.outputs.token }}
        run: |
          gh release download "${GITHUB_REF_NAME}" \
            -R "${GITHUB_REPOSITORY}" \
            -p "creche-observer_Linux_x86_64.tar.gz" \
            -p "creche-sink_Linux_x86_64.tar.gz" \
            -p "checksums.txt" \
            -p "checksums.txt.sigstore.json"
      - name: Download provenance
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: provenance.intoto.jsonl
      - name: Verify the observer
        run: mise run verify:binary creche-observer_Linux_x86_64.tar.gz
      - name: Verify the sink
        run: mise run verify:binary creche-sink_Linux_x86_64.tar.gz
