[settings]
experimental = true
env_cache = true
env_cache_ttl = "9h"
minimum_release_age = "7d"
pin = true
lockfile = true
locked = false
prefer_offline = true
disable_default_registry = true
disable_backends = ["asdf", "vfox", "ubi"]
# Lock only x64 platforms. conda:verapdf (the PDF/UA validator) has no arm64 build
# on conda-forge, so locking arm64 makes lock-file maintenance fail to resolve it.
# mise has no per-tool platform scoping so this is global. arm64 dev still works
# through live resolution (locked = false), just unlocked. Revisit for arm64 later.
lockfile_platforms = ["linux-x64", "linux-x64-musl", "macos-x64", "windows-x64"]
# Decide task freshness by hashing source contents, not mtimes. A fresh checkout
# resets mtimes, so mtime comparison would rebuild needlessly, while content
# hashing skips when the bytes are equal.
task.source_freshness_hash_contents = true

# Tools shared by local work and CI. Local-only tooling (linters, formatters, git
# hooks, mutation testing) lives in mise.dev.toml, which .miserc.toml loads for
# local work and CI never does (it sets MISE_ENV=ci). A tool sits here when both
# need it.
[tools]
mr-boxington = { version = "1.29.1", workflow = "release.yml@refs/heads/main" }
# The guest observer ships as a static musl binary (the Kata guest image is not
# guaranteed to have a compatible libc).
rust = { version = "1.99.1", mr_boxington = true, components = "clippy,rustfmt", targets = "x86_64-unknown-linux-musl" }
"github:nextest-rs/nextest" = "cargo-nextest-0.9.150"
cargo-deny = "0.20.2"
cocogitto = "7.0.0"
zizmor = "1.32.0"
jactionlint = { version = "2.4.0", workflow = "release.yaml" }
trivy = "0.76.1"

[tasks.test]
description = "Unit, property and doc tests, then again with debug assertions on a release build"
run = [
    "cargo nextest run --workspace --all-features --locked",
    "cargo nextest run --workspace --all-features --locked --cargo-profile release-assertions",
    "cargo test --workspace --all-features --locked --doc",
]

[tasks.bench]
description = "Criterion benchmarks: wire decoding, observer queue, sink rendering"
run = "cargo bench --workspace --all-features --benches"

[tasks.mutants]
description = "Mutation testing, must report 0 missed"
run = "cargo mutants --workspace --config mutants.toml"

[tasks.bump]
description = "Calculate the next versions from conventional commits, then tag and push"
run = "cog bump --auto"

[tasks."lint:gha"]
# jactionlint catches workflow syntax and expression errors and applies the
# security and policy rules of its default profile (.github/jactionlint.yaml).
# zizmor runs its security static analysis alongside, offline without a token
# (local) and with the online audits when GITHUB_TOKEN is set (the lint-gha job).
run = [
  "jactionlint --color --shellcheck=",
  "zizmor --config .github/zizmor.yml .github/workflows",
]
description = "Lint and security-audit the GitHub Actions workflows (jactionlint + zizmor)"
sources = [".github/workflows/**", ".github/zizmor.yml"]

[tasks."scan:trivy"]
description = "Scan for vulnerabilities, misconfigurations and licences with Trivy (report only)"
run = "trivy fs --config trivy.yaml ."
