# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en-US
reviews:
  profile: chill
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  in_progress_fortune: false
  review_status: true
  auto_review:
    enabled: true
    drafts: false
    # Stacked PRs target other branches, not only main.
    base_branches: [".*"]
  # hk.pkl holds the hook and lint config and is excluded by default. Lock
  # files and the generated yamllint lock stay excluded.
  path_filters:
    - "**"
    - "hk.pkl"
    - "!.mise/locks/**"
  tools:
    actionlint:
      enabled: true
    clippy:
      enabled: true
    gitleaks:
      enabled: true
    markdownlint:
      enabled: true
    shellcheck:
      enabled: true
    yamllint:
      enabled: true
  path_instructions:
    - path: "**/*"
      instructions: |
        Comments, docs and messages use plain ASCII sentences. Flag semicolons in
        prose, em or en dashes, smart quotes and other non-ASCII characters.
    - path: "crates/creche-wire/**"
      instructions: |
        STRICT. The no_std wire format shared with the BPF side.
        - The decoder must not allocate or panic on any input. The guest is
          untrusted, so every length and offset comes from an attacker.
        - Flag arithmetic that can overflow, indexing that can go out of bounds
          and casts that can truncate.
        - A struct or layout change must also change
          crates/creche-observer/bpf/wire.h and bump the wire version.
    - path: "crates/creche-observer/bpf/**"
      instructions: |
        STRICT. C BPF programs with CO-RE, loaded with aya.
        - Check verifier safety: bounded loops, checked map lookups, bounded
          reads with bpf_probe_read_* or CO-RE helpers.
        - Hook cost is the product. Flag extra map lookups, helper calls or
          ringbuf reservations on hot paths (exec, open, connect, fork, exit).
        - wire.h must match crates/creche-wire/src/lib.rs.
        - Keep the GPL-2.0-only OR BSD-2-Clause license.
    - path: "crates/creche-observer/src/**"
      instructions: |
        Guest daemon. Watch for unbounded memory, lost records, busy loops and
        wakeups that raise overhead inside the sandbox.
    - path: "crates/creche-sink/src/**"
      instructions: |
        Host daemon. Everything it reads comes from an untrusted guest.
        - No panic, unbounded allocation or blocking on malformed or hostile
          streams. One sandbox must not starve or crash the others.
        - JSON output must stay valid and escaped for any bytes.
        - Output field names follow OpenTelemetry semantic conventions.
    - path: "**/benches/**"
      instructions: |
        Benchmarks. Check they measure what the name says. Skip style nits.
    - path: "kernel/**"
      instructions: |
        Kata guest kernel config fragment. Flag options that widen the guest
        attack surface, such as unprivileged BPF.
    - path: ".github/**"
      instructions: |
        Least privilege permissions, actions pinned by SHA, no secrets exposed to
        untrusted code.
    - path: "{mise*.toml,hk.pkl,cog.toml,renovate.json}"
      instructions: |
        Tools are pinned through mise. Flag unpinned versions and tasks that
        differ between mise layers.
  pre_merge_checks:
    custom_checks:
      - name: "No attribution trailers"
        mode: error
        instructions: |
          Fail when the PR description or any commit message carries an
          attribution trailer or footer: Co-Authored-By, Generated-By, or a
          "Generated with" or "Generated by" tool line.
chat:
  auto_reply: true
